<style>
.a{animation:fd .6s ease-out both}
.dr{transform-box:fill-box;transform-origin:center;animation:drop .9s both}
.hl{fill:none;stroke:#2a2a33;stroke-width:2.5;opacity:0;animation:hl 10s infinite both}
.uw{transform-box:fill-box;transform-origin:left center;animation:uw 10s infinite both}
.wv{transform-box:fill-box;transform-origin:center;animation:wv 10s infinite both}
.bob{animation:bob 1.8s ease-in-out infinite alternate}
.bu{animation:rise linear infinite both}
.t{font:600 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#2a2a33}.v{font:700 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#2a2a33}.d{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#55555f}
.cd{font:700 18px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#2a2a33}.cn{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#55555f}
@keyframes drop{0%{opacity:0;transform:translateY(-60px) scale(.9)}60%{opacity:1;transform:translateY(8px) scale(1.02)}100%{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}}
@keyframes hl{0%{opacity:0}4%{opacity:.6}10%{opacity:.6}14%{opacity:0}100%{opacity:0}}
@keyframes uw{0%{opacity:1;transform:scaleX(0)}5%{opacity:1;transform:scaleX(1)}10%{opacity:1;transform:scaleX(1)}14%{opacity:0;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
@keyframes wv{0%{transform:translateY(0)}3%{transform:translateY(-7px)}7%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes bob{to{transform:translateY(-3px) rotate(-4deg)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.55}85%{opacity:.55}100%{transform:translateY(-900px);opacity:0}}
</style>
